<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Configurar senha do admin</title><style>body{font:16px system-ui;background:#f5f6fa;color:#17233c;padding:25px}main{max-width:480px;margin:30px auto;background:white;padding:30px;border-radius:16px}label{display:block;margin:20px 0}input{display:block;width:90%;padding:12px;margin-top:8px;font:inherit}button{background:#5260e8;color:white;border:0;padding:14px;border-radius:9px;font:inherit}p{line-height:1.6}a{color:#5260e8}</style></head><body><main><h1>Definir senha do admin</h1><p>Configuração inicial por link privado de uso único.</p><form><label>Usuário<input value="admin" disabled autocomplete="username"></label><label>Nova senha (mínimo 8 caracteres)<input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><label>Confirmar senha<input id="confirm" type="password" autocomplete="new-password" required></label><button disabled>Salvar senha</button></form><p id="status" role="status">Validando link…</p><a href="./">Voltar ao sistema</a></main><script>
const endpoint='https://script.google.com/macros/s/AKfycbxGJVvWWiEYrpl4WCN3HYNJCve3fDP0Yg3CJE7EknMlUbO_dry-9zs2XaGjbOjDB_tJ/exec',token=new URLSearchParams(location.hash.slice(1)).get('setup'),status=document.querySelector('#status'),button=document.querySelector('button');history.replaceState(null,'',location.pathname);let config;
async function api(body){const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},credentials:'omit',redirect:'follow',body:JSON.stringify(body)});const result=await response.json();if(!result.ok)throw Error(result.error||'Não foi possível concluir.');return result.result}
if(!token)status.textContent='Abra o link privado gerado no editor do Apps Script. Este endereço sem o link de uso único não permite definir a senha.';else api({action:'initialSetupInfo',token}).then(c=>{config=c;button.disabled=false;status.textContent='Link validado. Defina a senha de acesso ao sistema.'}).catch(error=>{status.textContent=error.message});
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const a=document.querySelector('#password'),b=document.querySelector('#confirm');if(a.value!==b.value){status.textContent='As senhas precisam ser iguais.';return}button.disabled=true;status.textContent='Protegendo a senha…';try{const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(a.value),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',iterations:config.iterations,salt:new TextEncoder().encode(config.salt)},key,256),proof=Array.from(new Uint8Array(bits),v=>v.toString(16).padStart(2,'0')).join('');a.value=b.value='';await api({action:'initialSetupSave',token,proof});status.textContent='Senha configurada. Volte ao sistema e entre com admin.'}catch(error){status.textContent=error.message;button.disabled=false}};
</script></body></html>
